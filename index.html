<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Blog preview card</title>

  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body {
      background-color: hsl(47, 88%, 63%);
    }
    .bloc_generale {
      background-color: hsl(0, 0%, 100%);
      width: 500px;
      border-radius: 20px;
      padding: 20px;
      margin-left: 580px;
    }
    .bloc_milieu {
      text-align: center;
    }
    .img_milieu {
      width: 100%;
      border-radius: 20px;
    }
    h2{
      color: hsl(0, 0%, 7%);
      margin-top: 0;
      margin-bottom: 10px;
      padding-top: 7px;
      font-family: "Epilogue", sans-serif;
      font-weight: 700;
    }
    .bloc_lerning{
      background-color: hsl(47, 88%, 63%);
      color: hsl(0, 0%, 100%);
      width: 150px;
      height: 40px;
      text-align: center;
      margin-top: 10px;
      border-radius: 5px;

    }
    h1{
      color: hsl(47, 88%, 63%);
      font-family: "Epilogue", sans-serif;
      font-weight: 700;
    }
    p{
      color: hsl(0, 0%, 42%);
      font-family: "Epilogue", sans-serif;
      font-size: 16px;
    }
    h3{
      color: hsl(0, 0%, 7%);
      font-family: "Epilogue", sans-serif;
      font-size: 16px;
    }
    h4{
      color: hsl(0, 0%, 7%);
      font-family: "Epilogue", sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-align: center;

    }
    .bloc_auteur{
      display: flex;
      align-items: center;
      margin-top: 20px;
      gap: 10px;
    }
    @media only screen and (max-width: 600px) {
      .bloc_generale {
        width: 90%;
        margin-left: auto;
        margin-right: auto;
      }
      h1{
        font-size: 3em;
      }
      
    }
  </style>
</head>
<body>
  <div class="bloc_generale">
    <div class="bloc_milieu">
      <img class="img_milieu" src="./assets/images/illustration-article.svg" alt="">
    </div>
    <div class="bloc_lerning">
      <h2>Learning</h2>
    </div>
    <h3>Published 21 Dec 2023</h3>
    <h1>HTML & CSS foundations</h1>
    <p> These languages are the backbone of every website, defining structure, content, and presentation.</p>
    <div class="bloc_auteur">
      <img src="./assets/images/image-avatar.webp" alt="">
      <h4>Greg Hooper</h4>
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Abdelkerim516">Abdel_Abbo</a>.
  </footer>
</body>
</html>
